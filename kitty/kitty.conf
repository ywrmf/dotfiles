# 隐藏窗口装饰（标题栏和边框）
#hide_window_decorations yes

background_blur 10

# 半透明背景
background_opacity 0.1

# 字体大小
font_size 14.0

# 字体家族
font_family JetBrainsMono Nerd Font Mono

# emoji 字体
emoji_family Noto Color Emoji

# Dracula 配色方案（低饱和暗雅版）
# 背景色 - 更暗
background #1e1f29
# 前景色 - 柔和白
foreground #e6e6e6
# 光标色 - 柔和紫
cursor #c2a6ff
# 选中背景 - 深灰蓝
selection_background #3a3c4a
# 选中前景
selection_foreground #e6e6e6
# 边框色
border #3a3c4a

# 颜色调色板（16色 - 低饱和）
color0 #1e1f29   # 黑色
color1 #ff6b6b   # 红色（降低饱和度）
color2 #87d682   # 绿色（降低饱和度）
color3 #ffd966   # 黄色（降低饱和度）
color4 #a777c2   # 蓝色（降低饱和度）
color5 #ce8ad8   # 紫色（降低饱和度）
color6 #7dc8c8   # 青色（降低饱和度）
color7 #e6e6e6   # 白色
color8 #5c5e70   # 亮黑
color9 #ff8e8e   # 亮红
color10 #a5f0a5   # 亮绿
color11 #ffe58c   # 亮黄
color12 #c9a9e6   # 亮蓝
color13 #e0a8f0   # 亮紫
color14 #9ee8e8   # 亮青
color15 #f5f5f5   # 亮白

# 光标轨迹效果
cursor_trail 1
